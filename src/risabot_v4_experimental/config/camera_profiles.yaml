version: 1

# These are deliberate placeholders, not estimated calibration values.
# Primary is the forward Astra (320x240 color); secondary is the right-back
# IMX219 (rotation-corrected at the driver, demand-managed at 480x272).
# Stage 1 will not publish BEV
# images until both profiles are measured and calibrated is changed to
# true with complete intrinsic/ground correspondences.
profiles:
  primary:
    sensor: Astra
    topic: /camera/color/image_raw
    calibrated: false
    resolution: [320, 240]
    camera_matrix: []
    distortion_coefficients: []
    source_points_px: []
    ground_points_m: []
    ground_bounds_m:
      forward: [0.05, 1.80]
      left: [-0.90, 0.90]
    pixels_per_meter: 200.0

  secondary:
    sensor: IMX219
    topic: /camera/second/image_raw
    calibrated: false
    resolution: [480, 272]
    camera_matrix: []
    distortion_coefficients: []
    source_points_px: []
    ground_points_m: []
    ground_bounds_m:
      forward: [-0.60, 0.80]
      left: [-0.90, 0.90]
    pixels_per_meter: 200.0
