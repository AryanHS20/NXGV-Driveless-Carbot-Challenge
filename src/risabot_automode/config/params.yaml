# ============================================================
# RISA-Bot Centralized Parameters
# All tunable parameters in one place for easy competition-day tuning.
# Load via launch file: parameters=[params_file]
# ============================================================

# --- Auto Driver (brain) ---
# PID TUNING GUIDE:
#   Start conservative: kp=0.8, ki=0.0, kd=0.2
#   If robot weaves/oscillates: INCREASE kd, DECREASE kp
#   If robot is slow to correct: INCREASE kp
#   If robot drifts to one side on a straight: INCREASE ki slightly
#   speed_error_scale: higher = more aggressive speed reduction in turns
#   min_turn_speed: 0.4 = robot never goes below 40% forward_speed in turns
auto_driver:
  ros__parameters:
    forward_speed: 0.15          # m/s maximum speed on a straight (conservative start)
    stale_timeout: 0.75
    traffic_unresolved_hold_sec: 1.0  # uncertain lamp expires; confirmed red still latches
    lane_control_mode: direct
    parking_max_duration: 45.0
    dist_lap_complete: 1.0
    enable_subsumption_obstacle: true
    max_odom_speed: 1.0
    min_state_dwell_sec: 0.25
    publish_loop_stats: true
    # PID gains (conservative — increase kp once tracking is reliable)
    pid_kp: 0.8
    pid_ki: 0.01
    pid_kd: 0.20
    pid_integral_max: 0.3
    # Adaptive speed
    speed_error_scale: 1.5
    min_turn_speed: 0.4
    lane_steer_slew: 3.0         # max angular.z change per second (Cytron acceleration limit)
    # Heading fusion feedforward
    heading_gain: 0.0            # feedforward gain for /fused_heading (corrects drift on straights)
    straight_curvature_threshold: 0.1  # curvature below this = straight enough for heading correction
    # Challenge 1→2 sequencing (distance-based gating)
    dist_post_obstacle_clear: 0.3     # re-center dist after obstacle clears (before roundabout)
    dist_roundabout: 1.5              # dist inside roundabout before exiting
    # ── Hill Climbing Mode (Challenge 5) ──────────────────────────────────
    # TUNING GUIDE:
    #   hill_pitch_threshold   : IMU pitch (deg) to enter HILL state. Start at 8-10°.
    #   hill_pitch_hysteresis  : pitch must drop this many degrees below threshold to EXIT.
    #                            Prevents rapid flapping on the crest. Default 4°.
    #   hill_base_speed        : speed (m/s) assigned when pitch first crosses threshold.
    #                            Should be slightly above forward_speed.
    #   hill_speed_per_degree  : extra m/s per extra degree of pitch.
    #                            e.g. 0.006 * 10° = +0.06 m/s boost.
    #   hill_max_speed         : hard cap. Never exceed this on the hill.
    #   hill_steer_scale       : fraction of lane-follow steering to keep (0 = dead straight).
    #   hill_sign_prime_sec    : seconds after seeing the hill sign that priming stays active.
    #   hill_sign_prime_threshold_reduction : degrees subtracted from threshold while primed.
    hill_pitch_threshold: 8.0
    hill_pitch_hysteresis: 4.0
    hill_base_speed: 0.18        # m/s — starting speed when robot tips onto the slope
    hill_speed_per_degree: 0.006 # extra m/s per degree above threshold
    hill_max_speed: 0.28         # safety cap — never go faster than this on the hill
    hill_steer_scale: 0.4        # keep 40% of lane steering on hill (helps stay straight)
    hill_sign_prime_sec: 8.0     # prime window duration after hill sign seen (seconds)
    hill_sign_prime_threshold_reduction: 3.0  # lower threshold by 3° when primed

# --- Command Safety Controller ---
cmd_safety_controller:
  ros__parameters:
    autonomy_source: legacy       # set to v4 only after Stage 8 wheels-up validation
    publish_hz: 50.0
    cmd_timeout: 0.35
    sensor_timeout: 0.5
    min_scan_points: 20
    require_signage: true
    lidar_angle_offset: 3.141592653589793
    footprint_half_width: 0.12
    footprint_front: 0.22
    footprint_rear: 0.22
    sweep_distance: 0.15
    max_linear_speed: 0.30
    max_angular_speed: 1.2
    max_linear_accel: 0.8
    max_angular_accel: 4.0
    deadband_linear: 0.01
    deadband_angular: 0.01
    publish_loop_stats: true

# --- Line Follower Camera (MDPI-enhanced scanline detection) ---
# TUNING GUIDE:
#   n_scanlines      : more scanlines = more robust but slightly slower
#   min_valid_scanlines: lower = less strict lane lock (may cause false locks)
#   min_line_width_px: raise if noise triggers false lane detections
#   crop_ratio_base  : increase if robot cuts corners on slight curves
#   search_radius_px : how far (pixels) a blob can be from expected position
#   white_threshold  : gray value cutoff for white border detection (higher = stricter)
#   use_otsu         : true = auto-threshold (unreliable on 3-tone tracks)
#   morph_open_size  : erosion→dilation kernel to remove noise (0=disable, 3=default)
#   morph_close_size : dilation→erosion kernel to fill gaps (0=disable, 5=default)
#   clahe_enabled    : disable if camera already has good auto-exposure
#   clahe_clip_limit : higher = more contrast boost (good for dim tracks)
# TRACKER MODE:
#   tracker_mode     : 'scanline' (old) or 'sliding' (new CV)
#   s_thresh         : HLS Saturation threshold for sliding window (100 is default)
#   sobel_thresh     : Sobel X gradient threshold (30 is default)
#   sliding_windows  : number of vertical windows (9 default)
#   sliding_margin   : half-width of sliding window (40 default)
#   sliding_minpix   : minimum pixels to recenter window (30 default)
# IPM (Bird's Eye View):
#   ipm_enabled      : DISABLED by default — requires calibration for camera mount
#   ipm_top_width_ratio : controls the narrow end of the trapezoid (further road)
#                         lower = more aggressive warp (0.2-0.5 typical)
#   ipm_bottom_width_ratio : controls the wide end (close road, usually 1.0)
# KALMAN FILTER:
#   kalman_enabled         : use Kalman instead of EMA for smoothing
#   kalman_process_noise   : Q — lower = smoother but slower to react
#   kalman_measurement_noise: R — lower = trusts measurements more
# LEGACY EMA (used when kalman_enabled=false):
#   smoothing_alpha  : EMA factor — lower = smoother but slower response
#   dead_zone        : tolerance threshold — skip Kalman update below this value
#   hold_error_frames: frames (~30fps) the last heading is held when lines are lost
#   error_decay_rate : 0.92 → held error halves every ~9 frames
line_follower_camera:
  ros__parameters:
    tracker_mode: 'sliding'
    pp_metric_enabled: false
    pp_lateral_span_m: 0.4
    pp_forward_span_m: 0.6
    pp_near_m: 0.1
    steering_max_deg: 50.0
    s_thresh: 100
    l_thresh: 200
    sobel_thresh: 30
    sliding_windows: 9
    sliding_margin: 40
    sliding_minpix: 30
    n_scanlines: 8
    min_valid_scanlines: 2
    min_measured_windows: 4           # require real left+right pairs before steering
    poly_residual_max: 0.08           # normalized lateral fit residual
    min_line_width_px: 5
    crop_ratio_base: 0.55           # raised from 0.4 — robot sees further ahead
    search_radius_px: 80             # blob-to-expected match radius
    # Thresholding — lane detection
    white_threshold: 100              # inverted mode: pixels BELOW this = lane (tune 80-120)
    use_otsu: true
    invert_binary: false               # true = detect dark lane, false = detect white borders
    # Morphological cleanup
    morph_open_size: 3                # remove noise blobs (0=disable)
    morph_close_size: 5               # fill small gaps in lane lines (0=disable)
    clahe_enabled: true
    clahe_clip_limit: 2.0
    # IPM — Bird's Eye View (DISABLED: camera is horizontal at 8.5cm, IPM distorts)
    ipm_enabled: false
    ipm_top_width_ratio: 0.35    # 0° tilt at 8.5cm height → moderate warp
    ipm_bottom_width_ratio: 1.0
    # Depth ground-plane mask (no training; drop non-floor white via depth)
    ground_mask_enabled: false  # true = require depth floor agreement (needs depth stream + intrinsics)
    ground_mask_tol_m: 0.03     # floor residual tolerance in metres
    cam_height_m: 0.085         # lens height above floor in metres
    cam_tilt_deg: 0.0           # downward pitch in degrees
    depth_max_age: 0.3          # max depth-frame age in seconds (arrival-timed)
    # Kalman filter (MDPI-inspired)
    kalman_enabled: true
    kalman_process_noise: 0.01
    kalman_measurement_noise: 0.1
    # Legacy EMA (fallback when kalman_enabled=false)
    smoothing_alpha: 0.3
    dead_zone: 0.05
    hold_error_frames: 15
    error_decay_rate: 0.92
    show_debug: false             # OFF by default — dashboard auto-enables for active view
    resize_width: 320
    print_debug: false
    debug_print_rate: 0.5

# --- Traffic Light Detector ---
# TUNING GUIDE:
#   sat_min / val_min    : raise if false positives on dark-coloured objects
#   required_confidence  : raise to reduce false triggers (3 = safe default)
#   min_pixel_count      : raise if detecting small coloured blobs that aren't lights
traffic_light_detector:
  ros__parameters:
    red_h_low1: 0
    red_h_high1: 10
    red_h_low2: 160
    red_h_high2: 180
    yellow_h_low: 20
    yellow_h_high: 35
    green_h_low: 40
    green_h_high: 85
    sat_min: 80
    val_min: 80
    min_circle_radius: 8
    max_circle_radius: 80
    min_pixel_count: 50
    required_confidence: 3
    show_debug: false
    resize_width: 320
    print_debug: false
    debug_print_rate: 0.5
    heartbeat_sec: 0.5

# --- Boom Gate Detector ---
boom_gate_detector:
  ros__parameters:
    min_detect_dist: 0.15
    max_detect_dist: 0.80
    angle_window: 0.35
    min_gate_points: 5
    distance_variance_max: 0.05
    lidar_angle_offset: 3.1416
    hysteresis: 3
    heartbeat_sec: 0.5

# --- Tunnel Wall Follower (RANSAC Enhanced) ---
# TUNING GUIDE:
#   kp / kd             : PD gains for distance centering (left-right balance)
#   kp_heading / kd_heading : PD gains for heading alignment (wall angle)
#   ransac_threshold    : inlier distance for RANSAC line fit (meters, lower = stricter)
#   ransac_iterations   : more iterations = better fit but slower (50 is fine for <100 pts)
#   tunnel_hysteresis_frames : consecutive frames before toggling tunnel state (prevents flicker)
#   lidar_angle_offset  : hardware mounting correction (radians). 3.1416 = LiDAR 0° points backward
tunnel_wall_follower:
  ros__parameters:
    target_center_dist: 0.0
    forward_speed: 0.12           # slightly faster for better inertia
    kp: 5.0                       # sharply increased to match lane follower steering magnitude
    kd: 0.5                       # derivative to dampen the high P gain
    kp_heading: 1.0               # stronger heading correction
    kd_heading: 0.1               
    max_angular: 2.0              # allow sharp turns (same limit as lane follower)
    output_alpha: 0.4             # EMA smoothing (0=frozen, 1=raw/noisy)
    left_angle_min: 0.26              # 15° (was 30° — catch walls near the front)
    left_angle_max: 2.09              # 120° (was 90° — catch walls slightly behind)
    right_angle_min: -2.09            # -120°
    right_angle_max: -0.26            # -15°
    lidar_angle_offset: 3.1416
    min_wall_points: 5             # require 5 pts per side (more robust)
    max_wall_dist: 0.80            # detect walls up to 80cm away
    ransac_threshold: 0.03         # 3cm inlier tolerance (forgiving for rough walls)
    ransac_iterations: 50
    tunnel_hysteresis_frames: 3
    heartbeat_sec: 0.2

# --- Heading & Odometry Fusion ---
heading_fusion:
  ros__parameters:
    alpha: 0.85
    stationary_deadband: 0.20
    max_allowed_dt: 0.5
    publish_rate_hz: 25.0

# --- Obstruction Avoidance (Dynamic VFH+ & Bezier) ---
obstruction_avoidance:
  ros__parameters:
    detect_dist: 0.50
    min_safe_dist: 0.20
    lateral_offset_m: 0.18
    spline_length_m: 0.80
    forward_speed: 0.12
    max_angular: 1.2
    hysteresis_ratio: 0.15
    lidar_angle_offset: 3.1416
    side_clear_dist: 0.50
    max_timeout_sec: 15.0

# --- Parking Controller ---
parking_controller:
  ros__parameters:
    parallel_forward_dist: 0.30
    parallel_reverse_dist: 0.35
    parallel_steer_angle: 0.6
    park_wait_time: 3.0
    perp_turn_angle: 1.57
    perp_forward_dist: 0.25
    drive_speed: 0.15
    reverse_speed: -0.12
    lidar_stop_dist: 0.15
    lidar_angle_offset: 3.1416


# --- Camera Obstacle Detection ---
obstacle_avoidance_camera:
  ros__parameters:
    edge_threshold: 0.08        # raised from 0.02 — floor tiles trigger at ~2%, real obstacles at ~10%
    canny_low: 50
    canny_high: 150
    blur_kernel: 5
    hysteresis_on: 5
    hysteresis_off: 8
    show_debug: false
    resize_width: 320
    print_debug: false
    debug_print_rate: 0.5
    heartbeat_sec: 0.5

# --- LiDAR Obstacle Detection ---
obstacle_avoidance_node:
  ros__parameters:
    min_obstacle_distance: 0.48
    lidar_angle_offset: 3.141592653589793
    heartbeat_sec: 0.5

# --- Dashboard ---
dashboard:
  ros__parameters:
    use_hw_odom: true
    freshness_stale_sec: 2.0
    sim_odom_scale: 1.55
    hw_odom_scale: 1.0
    hw_odom_yaw_scale: 1.0
    cam_encode_max_hz: 10.0   # MJPEG encode cap — lower if dashboard video stutters

# --- Health Monitor ---
health_monitor:
  ros__parameters:
    publish_period: 0.5
    timeout_perception: 1.5
    timeout_state: 2.0
    timeout_control: 1.0
    timeout_odom: 1.0
    timeout_joy: 2.0

# --- Servo Controller ---
servo_controller:
  ros__parameters:
    servo_steer_id: 4
    servo_center: 100           # calibrated true mechanical center (was 90 — wheels sat turned left at 90)
    servo_range_left: 50            # servo units from center to max LEFT steer
    servo_range_right: 70           # servo units from center to max RIGHT steer
    speed_levels: [15, 25, 40, 60, 100]
    default_speed_index: 1
    joy_timeout: 0.8
    auto_cmd_timeout: 0.4
    parallel_recording: ""
    perpendicular_recording: ""
    motor_duty_per_mps: 255.0
    unlock_requires_neutral: true
    unlock_neutral_threshold: 0.15
    hw_heartbeat_sec: 1.0
    hw_fail_limit: 5
    ticks_per_meter: 1050.0
    drive_motor_index: 0        # which encoder channel to use (0=FL, 1=FR, 2=RL, 3=RR)
    odom_distance_scale: 1.0
    odom_yaw_scale: 1.0
    encoder_jump_threshold: 800.0
    max_linear_velocity: 1.0
    max_angular_velocity: 6.0
    odom_reverse_polarity: false
    wheel_base: 0.14
    steering_max_deg: 50.0
    odom_vel_alpha: 0.3
    odom_velocity_deadband: 0.02
    publish_loop_stats: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    # ── Auto-mode steering asymmetry correction ──────────────────────────────
    # Ackermann geometry means the robot needs more servo throw on one side to
    # achieve the same physical turning radius. If right turns are sluggish,
    # increase this value. 1.0 = no boost (symmetric). 1.3 = 30% more right servo angle.
    # This multiplier ONLY applies in auto mode (process_twist). Manual is unaffected.
    # TUNING: Start at 1.3. If still understeering right, try 1.4. Max ~1.6 before servo clamps.
    auto_right_steer_boost: 1.3

# --- BPU Signage Detector (YOLO11n NXGV, 10-class) ---
# CLASS MAP:
#   0: end_of_tunnel_sign   <- clears /tunnel_confidence (advisory only, gated, edge-published)
#   1: hill_sign            <- CRUCIAL  (Challenge 5 — hill climb trigger)
#   2: obstacle_sign        <- /obstacle_sign_detected (mission advisory)
#   3: parallel_parking     <- CRUCIAL  (parking trigger)
#   4: perpendicular_park   <- CRUCIAL  (parking trigger)
#   5: roundabout_sign      <- debug only (auto_driver is time-based)
#   6: speed_bump_sign      <- debug only (no topic yet)
#   7: traffic_light lamp   <- CRUCIAL  (/traffic_light_state via HSV vote)
#   8: traffic_warn_sign    <- debug only
#   9: tunnel_sign          <- sets /tunnel_confidence (advisory only, gated, edge-published)
#
# NOTE: signage_detector no longer publishes /tunnel_detected. That topic is
# now owned solely by tunnel_wall_follower (LiDAR ground truth) — see that
# node's docstring. signage_detector's tunnel/end-of-tunnel classes publish
# to the separate /tunnel_confidence topic instead, so the two nodes can no
# longer race for the same topic.
#
# TUNING GUIDE:
#   Per-class thresh: laptop-measured operating points. Lower = more sensitive.
#   tunnel_publish_enabled: false = signage never publishes /tunnel_confidence
#     (this is purely an advisory signal now; disabling it cannot affect
#     tunnel state transitions, which come only from tunnel_wall_follower)
#   iou_threshold : NMS overlap threshold (0.45 is standard YOLOv5 default)
#   min_parking_sign_width : pixel width gate — ignore tiny parking detections
signage_detector:
  ros__parameters:
    model_path: "/home/sunrise/unified16_yolo11n_640x640_nv12.bin"
    observation_timeout: 0.5
    traffic_confirm_frames: 5         # consecutive lamp frames before red/green/unresolved
    conf_threshold: 0.25          # global fallback (per-class thresholds below take priority)
    iou_threshold: 0.45
    show_debug: false             # OFF by default — dashboard auto-enables when signage view active
    heartbeat_sec: 0.5
    min_parking_sign_width: 0     # set >0 to require minimum bounding-box width for parking
    tunnel_publish_enabled: true  # edge-triggered /tunnel_confidence (advisory); false disables it entirely
    publish_boom_state: false     # vision boom hint on /boom_gate_open; keep OFF until real-footage validation (LiDAR owns boom)

    # Per-class thresholds (laptop-measured operating points):
    thresh_end_tunnel: 0.40       # class 0
    thresh_hill: 0.25             # class 1
    thresh_obstacle: 0.50         # class 2 (blue-clutter FPs)
    thresh_parallelp: 0.50        # class 3 (phone UI hit 0.72)
    thresh_perpendp: 0.50         # class 4
    thresh_roundabout: 0.35       # class 5
    thresh_speedbump: 0.50        # class 6 (small/far)
    thresh_tl_lamp: 0.30          # class 7 (HSV decides red/green)
    thresh_tl_warn: 0.40          # class 8
    thresh_tunnel: 0.40           # class 9
    thresh_traffic_red: 0.25      # class 10 (direct colour)
    thresh_traffic_yellow: 0.25   # class 11
    thresh_traffic_green: 0.25    # class 12
    thresh_boom_closed: 0.35      # class 13
    thresh_boom_partial: 0.35     # class 14 (zero recall: counts as blocked)
    thresh_boom_open: 0.35        # class 15

# --- Map Recorder (persistent run mapping) ---
# Records every run to <map_dir>/run_<UTC>.jsonl. Phase 1 is record-only:
# nothing consumes the map yet, so these params cannot affect driving.
map_recorder:
  ros__parameters:
    map_enabled: true             # record every run; false pauses mapping
    map_dir: ""                   # empty = ~/risabot_maps
    sample_hz: 5.0                # samples per second

# --- MIPI Relay (side MIPI cameras -> stack-standard side topics) ---
# Layout: Astra faces forward (native /camera/color/image_raw, no relay).
# IMX219 = RIGHT-BACK (verified 2026-09-19: its footage currently appears
#   on the dashboard via a temporary mipi_relay_fwd instance because the
#   forward Astra is absent; remove that instance once Astra returns).
# OV5647 = other side (left/right TBD at mounting).
# If left/right turn out swapped, flip the two pairs below.
# The mipi_cam nodes run as root via the risabot-cams systemd service, not
# from this launch. max_hz throttles the 30fps MIPI streams before republish.
mipi_relay:
  ros__parameters:
    source_topic: "/cam_imx219/image_raw"
    target_topic: "/camera/second/image_raw"
    second_enabled: true
    second_source: "/cam_ov5647/image_raw"
    second_target: "/camera/third/image_raw"
    max_hz: 30.0
