v4_motion_executor:
  ros__parameters:
    enabled: false
    command_contract_validated: false
    stop_preemption_validated: false
    timeout_validated: false
    # Open only while a named operator is supervising a wheels-up or ground test.
    operator_motion_authorized: false
    allow_legacy_challenge_passthrough: true
    publish_hz: 50.0
    proposal_timeout_sec: 0.35
    path_timeout_sec: 0.50
    path_max_age_sec: 45.0
    odom_timeout_sec: 0.25
    state_timeout_sec: 0.50
    legacy_timeout_sec: 0.35
    wheelbase_m: 0.216
    maximum_steer_deg: 50.0
    forward_speed_mps: 0.08
    path_forward_speed_mps: 0.06
    path_reverse_speed_mps: 0.05
    minimum_speed_scale: 0.40
    completion_distance_m: 0.04
    hill_max_speed_mps: 0.18
